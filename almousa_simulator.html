  const k=tex(96,576);c.ct=k;c.cx=k.image.getContext('2d');const pw=Math.min(.16,rt-.03),cb=new THREE.Mesh(new THREE.PlaneGeometry(pw,1.5),new THREE.MeshBasicMaterial({map:k}));cb.position.set(dw/2+rt/2,1.15,cd/2-.03);cb.rotation.y=Math.PI;m.add(cb);drawCob(c);
  const pl=new THREE.PointLight(0xfff0d8,.7,6);pl.position.set(0,2.1,0);m.add(pl);const s=lab(c.id,'#c8102e',2.2);s.position.set(0,CH+.9,0);m.add(s);
  cars.push(c)});
 const mk=(a,y1,y2)=>{a.scale.y=y2-y1;a.position.y=(y1+y2)/2};window.setR=mk}
function step(dt){const n=Math.ceil(dt/.05);for(let k=0;k<n;k++)adv(dt/n)}
function adv(dt){at-=dt;if(auto&&at<0){at=2+Math.random()*3;const c=cars[Math.random()*cars.length|0];if(c.q.length<3)c.q.push(Math.random()*NF|0)}
 cars.forEach(c=>{
  if(c.st=='idle'&&c.q.length){const f=c.q.shift();c.tg=f*FH;if(Math.abs(c.tg-c.y)<.01)c.st='open';else c.st='mov'}
  else if(c.st=='mov'){const d=c.tg-c.y,s=Math.sign(d);c.dir=s;c.v+=Math.max(-.9*dt,Math.min(.9*dt,s*Math.min(1.5,Math.sqrt(2*.9*Math.abs(d)))-c.v));c.y+=c.v*dt;
   if(Math.abs(c.tg-c.y)<Math.max(.03,Math.abs(c.v)*dt)&&Math.abs(c.v)<.4){c.y=c.tg;c.v=0;c.st='open'}}

  else if(c.st=='hold'){c.t+=dt;if(c.t>(c.q.length?1.2:2.8))c.st='close'}

function place(){const L=lay();cars.forEach(c=>{c.m.position.y=c.y;const o=c.dw*.45*c.door;c.dp[0].position.x=-(c.dw/4+o);c.dp[1].position.x=c.dw/4+o;
  if(c.lf>=0&&c.lf!=c.fl||c.door==0&&c.lf>=0){const p=c.ld[c.lf];p[0].position.x=c.xi-c.dw/4;p[1].position.x=c.xi+c.dw/4;c.lf=-1}

  const cy=FH*(NF-1)-c.y+1.5;c.cwm.position.y=cy;setR(c.ra,c.y+CH+.2,T0());setR(c.rb,cy+1.2,T0());setR(c.tc,Math.min(c.y-.3,22),Math.max(c.y-.3,22))});
 const c=cars[sel];

 else{if(mode=='follow')tgt.set(c.xi,c.y+1.4,c.cz);else tgt.set(0,22,0);cam.position.set(tgt.x+dist*Math.sin(yaw)*Math.cos(pch),tgt.y+dist*Math.sin(pch),tgt.z+dist*Math.cos(yaw)*Math.cos(pch));cam.lookAt(tgt)}}

function side(){const{g}=lay(),k=(a,b,c)=>`<div class="${c||''}"><small>${a}</small>${b}</div>`;
 $('#sd').innerHTML=`<h2>Group ${gk} <small>${g.ids}</small></h2><div class="kp">${k('Quantity',g.n+(g.n>1?' units':' unit'))+k('Capacity',g.kg+' kg · 90 mpm')+k('Operation',g.op)+k('Stops','12 / 12')+k('Travel','44,000 mm')+k('Pit / overhead',g.pit.toLocaleString('en')+' / 4,500')+k('Hoistway (w × d)',g.tbc?'TBC':g.hw.join(' × '))+k('Car inside',g.car.join(' × '))+k('Entrance',g.door+' mm · 2CO')+k('Counterweight',g.cwt)+k('Unit price (excl. VAT)','SAR '+g.up)+k('Group total (excl. VAT)','SAR '+g.tot,'t')}</div>

function sec(L){const{n,pit,g}=L,T=(NF-1)*FH+OH,sy=560/(T+pit);SY={T,sy};const Y=h=>30+(T-h)*sy;let s=`<svg viewBox="0 0 340 620"><rect x="110" y="${Y(T)}" width="110" height="${(T+pit)*sy}" fill="none" stroke="currentColor" stroke-width="2"/><rect x="116" y="${Y(T)+4}" width="98" height="${OH*sy-8}" fill="none" stroke="#888" stroke-dasharray="4"/><text x="124" y="${Y(T)+OH*sy/2}" style="fill:var(--mu)">OVERHEAD</text>`;

function plan(L){const{g,n,W,D,cw,cd,dw,xs,cz}=L,s=Math.min(400/W,300/D),ox=(520-W*s)/2,oy=64,px=x=>ox+(x+W/2)*s,pz=z=>oy+(z+D/2)*s,da=g.tbc?'stroke-dasharray="6"':'';

  o+=g.cwt=='Side'?`<rect x="${px(-W/2+.15)}" y="${pz(cz-cd/4)}" width="${.25*s}" height="${cd*.5*s}" fill="none" stroke="#888" stroke-dasharray="3"/><text x="${px(-W/2+.15)}" y="${pz(cz)}" style="fill:var(--mu)">CWT</text>`:`<rect x="${px(x-cw*.3)}" y="${pz(-D/2+.12)}" width="${cw*.6*s}" height="${.25*s}" fill="none" stroke="#888" stroke-dasharray="3"/><text x="${px(x)-10}" y="${pz(-D/2+.12)-3}" style="fill:var(--mu)">CWT</text>`});
